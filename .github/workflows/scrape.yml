# .github/workflows/scrape.yml
#
# Per-market scraper workflow - injected into each market repo by deploy/deploy.py.
# 15 3,7,11,15,19,23 * * * / XSUPERMERCADOS are replaced per market.
#
# Secrets required in each market repo (set automatically by deploy.py):
#   STORE_KEY               - e.g. "atacadao"
#   DATABASE_URL_{MARKET}   - e.g. DATABASE_URL_ATACADAO (Neon)
#   SCRAPE_ZIP_CODE         - optional, overrides config.SCRAPE_ZIP_CODE

name: Scrape

concurrency:
  group: scrape
  cancel-in-progress: false

on:
  schedule:
    - cron: '15 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products to scrape (empty = no limit)"
        required: false
        default: ""
      zip_code:
        description: "CEP override"
        required: false
        default: ""
      skip_enrich:
        description: "Skip barcode enrichment"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        # Reference each secret explicitly (never dump the whole secrets context).
        shell: bash
        env:
          STORE_DB_URL:    ${{ secrets.DATABASE_URL_XSUPERMERCADOS }}
          SCRAPE_ZIP_CODE: ${{ secrets.SCRAPE_ZIP_CODE }}
        run: |
          {
            printf 'DATABASE_URL_XSUPERMERCADOS=%s\n' "$STORE_DB_URL"
            if [ -n "$SCRAPE_ZIP_CODE" ]; then printf 'SCRAPE_ZIP_CODE=%s\n' "$SCRAPE_ZIP_CODE"; fi
          } > .env
          echo "Created .env for XSUPERMERCADOS"

      - name: Run scraper
        run: |
          STORE="${{ secrets.STORE_KEY }}"
          ARGS="--stores $STORE --log --post"
          if [ "${{ inputs.skip_enrich }}" = "true" ]; then ARGS="$ARGS --skip-enrich"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.zip_code }}" ]; then ARGS="$ARGS --zip ${{ inputs.zip_code }}"; fi
          python -m main $ARGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7
